[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
# Start narrow (unused imports/vars, obvious bugs) rather than reformatting
# an entire pre-existing codebase in one pass - broader style rules can be
# turned on incrementally later.
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by the line-length setting above, not as a hard error

[tool.ruff.lint.per-file-ignores]
# faulthandler.enable() is deliberately called before the rest of the
# imports (so a segfault during an import itself still gets a stack trace),
# which ruff otherwise flags as "import not at top of file".
"main.py" = ["E402"]
